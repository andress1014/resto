services:
  postgres:
    image: postgres:16-alpine
    container_name: resto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resto_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: resto_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-oleada-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      IDENTITY_SERVICE_URL: http://identity:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      SESSION_SERVICE_URL: http://session:4003
      ORDERING_SERVICE_URL: http://ordering:4004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  identity:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: resto_identity
    ports:
      - "4001:4001"

  catalog:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: resto_catalog
    ports:
      - "4002:4002"

  session:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/session/Dockerfile
    container_name: resto_session
    ports:
      - "4003:4003"

  ordering:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/ordering/Dockerfile
    container_name: resto_ordering
    ports:
      - "4004:4004"

volumes:
  postgres_data:
  redis_data:
